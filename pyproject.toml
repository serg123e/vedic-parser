[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-parser"
version = "0.1.0"
description = "Tools for querying vedic-horo.com / vedic-horo.ru and parsing the results"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vedic-parser = "vedic_parser.cli:main"

[tool.setuptools.packages.find]
include = ["vedic_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
